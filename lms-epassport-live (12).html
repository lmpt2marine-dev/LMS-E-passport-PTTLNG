<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PTT LNG · LMS E-Passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#081120; --bg2:#0B1830; --panel:#0F2038; --panel2:#132A47;
  --line:rgba(120,180,220,.14); --line2:rgba(120,180,220,.28);
  --teal:#17C3CE; --teal2:#0E8FA8; --gold:#F5B841; --gold2:#C9922A;
  --ink:#E9F2FA; --mut:#8AA0BA; --mut2:#5E7590;
  --ok:#3BD08A; --bad:#F26D6D;
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;line-height:1.55;
  background-image:
    radial-gradient(900px 500px at 85% -10%, rgba(23,195,206,.10), transparent 60%),
    radial-gradient(700px 420px at -10% 100%, rgba(245,184,65,.06), transparent 60%);
}
h1,h2,h3,.kanit{font-family:'Kanit',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 90px}
.wrap.wide{max-width:940px}
@media(min-width:700px){.wrap{padding-top:28px}}

/* ---------- login ---------- */
.login{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.passport-cover{
  background:linear-gradient(160deg,#0D2242 0%,#0A1B36 55%,#082238 100%);
  border:1px solid var(--line2);border-radius:22px;padding:36px 28px 30px;
  box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.passport-cover::before{content:'';position:absolute;inset:10px;border:1px dashed rgba(245,184,65,.35);border-radius:16px;pointer-events:none}
.emblem{width:74px;height:74px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}

.cover-eyebrow{text-align:center;letter-spacing:.42em;font-size:.66rem;color:var(--gold);font-weight:600;text-transform:uppercase}
.cover-title{text-align:center;font-size:1.9rem;font-weight:600;letter-spacing:.02em;margin:6px 0 2px;background:linear-gradient(90deg,#E9F2FA,#9FE8EC);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover-sub{text-align:center;color:var(--mut);font-size:.86rem;margin-bottom:26px}
.fld{position:relative;margin-bottom:12px}
.fld input{
  width:100%;background:rgba(8,17,32,.7);border:1px solid var(--line2);border-radius:12px;
  padding:14px 16px;color:var(--ink);font-size:1rem;outline:none;transition:border .2s;
}
.fld input:focus{border-color:var(--teal)}
.fld input::placeholder{color:var(--mut2)}
.hint{font-size:.78rem;color:var(--mut2);text-align:center;margin-top:10px}
.sugs{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#0D1E38;border:1px solid var(--line2);border-radius:12px;overflow:hidden;z-index:30;max-height:260px;overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.sug{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:.92rem}
.sug:last-child{border-bottom:none}
.sug:hover,.sug.on{background:rgba(23,195,206,.12)}
.sug small{display:block;color:var(--mut2);font-size:.74rem}
.btn{
  width:100%;border:none;border-radius:12px;padding:14px;font-size:1.02rem;font-weight:600;
  font-family:'Kanit',sans-serif;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--teal2),var(--teal));color:#04222A;
  box-shadow:0 8px 24px rgba(23,195,206,.28);transition:transform .15s, filter .15s;
}
.btn:active{transform:scale(.98)}
.btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed;box-shadow:none}
.err{color:var(--bad);font-size:.84rem;text-align:center;margin-top:10px;min-height:1.2em}

/* ---------- app chrome ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.topbar .emblem{width:44px;height:44px;margin:0}

.who{flex:1;min-width:0}
.who .nm{font-family:'Kanit';font-weight:500;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .dp{font-size:.74rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout{background:none;border:1px solid var(--line2);color:var(--mut);border-radius:10px;padding:8px 12px;font-size:.8rem}
.logout:hover{color:var(--ink);border-color:var(--teal)}

/* passport points page */
.pp{
  background:linear-gradient(155deg,var(--panel2),var(--panel));
  border:1px solid var(--line2);border-radius:var(--r);padding:22px 20px 18px;position:relative;overflow:hidden;margin-bottom:14px;
}
.pp::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--gold))}
.pp .lbl{font-size:.7rem;letter-spacing:.3em;color:var(--mut);text-transform:uppercase;font-weight:600}
.bigpts{display:flex;align-items:baseline;gap:10px;margin:4px 0 2px}
.bigpts .n{font-family:'JetBrains Mono';font-weight:700;font-size:3.4rem;line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(245,184,65,.35)}
.bigpts .u{font-family:'Kanit';color:var(--mut);font-size:1rem}
.pp .sub{font-size:.82rem;color:var(--mut)}
.pp .stamp{
  position:absolute;right:14px;top:16px;width:84px;height:84px;border:2px solid rgba(245,184,65,.55);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);
  color:rgba(245,184,65,.85);font-family:'Kanit';opacity:.9;
}
.pp .stamp b{font-size:1.5rem;line-height:1}
.pp .stamp span{font-size:.56rem;letter-spacing:.2em}
.ppgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.mini .k{font-size:.72rem;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.mini .v{font-family:'JetBrains Mono';font-weight:600;font-size:1.5rem;margin-top:2px}
.mini .v small{font-size:.85rem;color:var(--mut);font-family:'Kanit';font-weight:400}

/* chase card */
.chase{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.chase .t{font-family:'Kanit';font-size:.92rem;margin-bottom:8px;color:var(--ink)}
.chase .t b{color:var(--teal)}
.bar{height:10px;border-radius:6px;background:rgba(120,180,220,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal2),var(--teal));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.chase .cap{display:flex;justify-content:space-between;font-size:.74rem;color:var(--mut);margin-top:6px}
.crown{color:var(--gold)}

/* sections */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.sec>h3{padding:14px 16px 0;font-size:1rem;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .cnt{font-family:'JetBrains Mono';font-size:.72rem;color:var(--teal);background:rgba(23,195,206,.1);border:1px solid rgba(23,195,206,.3);border-radius:999px;padding:1px 9px}
.sec .body{padding:10px 16px 16px}

/* leaderboard */
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:none}
.rk{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-weight:600;font-size:.86rem;background:rgba(120,180,220,.08);color:var(--mut);flex:none}
.rk.r1{background:linear-gradient(135deg,#F5B841,#C9922A);color:#2A1B00}
.rk.r2{background:linear-gradient(135deg,#C9D6E4,#8FA3B8);color:#101C2B}
.rk.r3{background:linear-gradient(135deg,#D89B6A,#A66B3C);color:#2A1200}
.lb-nm{flex:1;min-width:0}
.lb-nm .n{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-nm .d{font-size:.7rem;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-pt{font-family:'JetBrains Mono';font-weight:600;color:var(--gold)}
.lb-row.me{background:linear-gradient(90deg,rgba(23,195,206,.12),transparent);border-radius:10px;padding-left:8px;padding-right:8px;margin:0 -8px;border-bottom-color:transparent}
.lb-row.me .n{color:var(--teal)}
.me-tag{font-size:.62rem;background:var(--teal);color:#04222A;border-radius:6px;padding:1px 6px;font-weight:700;margin-left:6px;font-family:'Kanit'}
.dots{text-align:center;color:var(--mut2);letter-spacing:.4em;padding:2px 0}

/* course stamps */
.course{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.course:last-child{border-bottom:none}
.cstamp{flex:none;width:44px;height:44px;border-radius:50%;border:1.6px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);font-family:'Kanit'}
.cstamp b{font-size:1.02rem;line-height:1}
.cstamp span{font-size:.5rem;letter-spacing:.08em}
.cstamp.e{border-color:rgba(245,184,65,.7);color:var(--gold)}
.cstamp.a{border-color:rgba(23,195,206,.7);color:var(--teal)}
.cinfo{flex:1;min-width:0}
.cinfo .cn{font-size:.9rem;line-height:1.4}
.cinfo .cm{font-size:.72rem;color:var(--mut2);margin-top:2px}
.tag{display:inline-block;font-size:.64rem;border-radius:6px;padding:1px 7px;margin-right:6px;font-family:'Kanit';letter-spacing:.04em}
.tag.e{background:rgba(245,184,65,.12);color:var(--gold);border:1px solid rgba(245,184,65,.3)}
.tag.a{background:rgba(23,195,206,.1);color:var(--teal);border:1px solid rgba(23,195,206,.3)}

/* rewards */
.rw-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:480px){.rw-grid{grid-template-columns:1fr 1fr}}
.rw{
  border:1px solid rgba(245,184,65,.32);border-radius:14px;padding:14px;position:relative;overflow:hidden;
  background:linear-gradient(150deg, rgba(245,184,65,.10), rgba(245,184,65,.02));
}
.rw::before{content:'';position:absolute;left:-8px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--panel);border:1px solid rgba(245,184,65,.32);transform:translateY(-50%)}
.rw::after{content:'';position:absolute;right:-8px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--panel);border:1px solid rgba(245,184,65,.32);transform:translateY(-50%)}
.rw .rw-name{font-family:'Kanit';font-weight:500;font-size:.98rem}
.rw .rw-pts{font-family:'JetBrains Mono';font-weight:700;color:var(--gold);font-size:1.3rem;margin:2px 0}
.rw .rw-pts small{font-family:'Kanit';font-weight:400;font-size:.78rem;color:var(--mut)}
.rw .rw-stock{font-size:.74rem;color:var(--mut)}
.rw .rw-stock.low{color:var(--bad)}
.rw button{
  margin-top:10px;width:100%;border:none;border-radius:10px;padding:10px;font-family:'Kanit';font-weight:600;font-size:.92rem;
  background:linear-gradient(90deg,var(--gold2),var(--gold));color:#2A1B00;
}
.rw button:disabled{filter:grayscale(.8) brightness(.55);cursor:not-allowed}
.rw.soldout{opacity:.55}

/* campaign */
.camp{display:flex;flex-direction:column;gap:10px}
.camp-row{display:flex;align-items:center;gap:12px;background:rgba(120,180,220,.05);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.camp-ico{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;background:rgba(23,195,206,.1);border:1px solid rgba(23,195,206,.25)}
.camp-ico.km{background:rgba(245,184,65,.1);border-color:rgba(245,184,65,.3)}
.camp-info{flex:1;min-width:0}
.camp-info .cn{font-family:'Kanit';font-size:.88rem}
.camp-info .cd{font-size:.72rem;color:var(--mut2)}
.camp-lead{text-align:right;flex:none}
.camp-lead .who{font-size:.76rem;color:var(--mut);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp-lead .pt{font-family:'JetBrains Mono';font-weight:600;color:var(--gold);font-size:.9rem}
.camp-row.mine{border-color:rgba(23,195,206,.5);background:rgba(23,195,206,.07)}

/* redeem log */
.log-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.log-row:last-child{border-bottom:none}
.log-row .li{min-width:0}
.log-row .item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-row .when{font-size:.7rem;color:var(--mut2)}
.log-row .pt{font-family:'JetBrains Mono';font-weight:600;color:var(--bad);flex:none}
.log-row .pt.plus{color:var(--ok)}
.empty{color:var(--mut2);font-size:.84rem;text-align:center;padding:14px 0}

/* admin */
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.tools{display:flex;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.tools input{flex:1;min-width:180px;background:rgba(8,17,32,.7);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;color:var(--ink);outline:none}
.tools input:focus{border-color:var(--teal)}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font-family:'Kanit';font-weight:500;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid var(--line2)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{font-family:'JetBrains Mono';text-align:right}
.tbl .gold{color:var(--gold)}
.editbtn{background:none;border:1px solid var(--line2);color:var(--teal);border-radius:8px;padding:5px 10px;font-size:.76rem;white-space:nowrap}
.editbtn:hover{border-color:var(--teal)}
.editbtn.del{color:var(--bad)}
.editbtn.del:hover{border-color:var(--bad)}
.editbtn:disabled{opacity:.35;cursor:not-allowed}
.tabbtns{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabbtn{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 16px;font-size:.86rem;font-family:'Kanit'}
.tabbtn.on{background:rgba(23,195,206,.14);border-color:var(--teal);color:var(--teal)}
.scrollx{overflow-x:auto;margin:0 -16px;padding:0 16px}
.subh{font-family:'Kanit';font-size:.92rem;margin:14px 0 6px;color:var(--ink)}

/* modal */
.mask{position:fixed;inset:0;background:rgba(4,9,18,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--panel2);border:1px solid var(--line2);border-radius:18px;padding:22px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{font-size:1.06rem;margin-bottom:10px}
.modal p{font-size:.9rem;color:var(--mut);margin-bottom:6px}
.modal p b{color:var(--gold);font-family:'JetBrains Mono'}
.modal .acts{display:flex;gap:10px;margin-top:16px}
.modal .acts .btn{padding:11px;font-size:.94rem}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--mut);box-shadow:none}
.btn.gold{background:linear-gradient(90deg,var(--gold2),var(--gold));color:#2A1B00;box-shadow:0 8px 24px rgba(245,184,65,.25)}
.modal input{width:100%;background:rgba(8,17,32,.7);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;color:var(--ink);font-size:.95rem;outline:none;margin-top:6px}
.modal input:focus{border-color:var(--teal)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0E2A2C;border:1px solid var(--teal);color:var(--ink);padding:12px 20px;border-radius:12px;font-size:.9rem;opacity:0;transition:.3s;z-index:200;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:.76rem;color:var(--mut2);margin-top:8px}

/* mascot */
#mascotWrap{position:fixed;right:10px;bottom:14px;z-index:60;width:86px;pointer-events:none}
#mascotWrap img{width:100%;display:block;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45));animation:mbob 3.2s ease-in-out infinite;transform-origin:bottom center}
@keyframes mbob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
#mascotWrap img.hop{animation:mhop .65s cubic-bezier(.3,1.6,.4,1)}
@keyframes mhop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-22px) scale(1.07) rotate(-5deg)}60%{transform:translateY(0) scale(.96)}80%{transform:translateY(-7px)}100%{transform:translateY(0)}}
.mbub{position:absolute;bottom:calc(100% + 12px);right:0;width:max-content;max-width:min(240px,72vw);background:#0D2242;border:1px solid var(--teal);border-radius:14px;padding:10px 13px;font-size:.82rem;line-height:1.5;color:var(--ink);box-shadow:0 14px 34px rgba(0,0,0,.5);pointer-events:auto}
.mbub b{color:var(--gold)}
.mbub::after{content:'';position:absolute;top:100%;right:30px;border:7px solid transparent;border-top-color:var(--teal)}
.mbub.pop{animation:mpop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes mpop{0%{opacity:0;transform:translateY(8px) scale(.88)}100%{opacity:1;transform:translateY(0) scale(1)}}
.mascot-login{display:block;position:relative;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5));animation:mbob 3.2s ease-in-out infinite;transform-origin:bottom center}
.mascot-login-wrap{position:relative;z-index:2;width:112px;margin:0 auto -36px}
.mascot-login{width:100%;margin:0}
.mascot-login.hop{animation:mhop .65s cubic-bezier(.3,1.6,.4,1)}
.login-bub{right:auto;left:50%;transform:translateX(-50%);max-width:min(270px,84vw);text-align:center}
.login-bub::after{right:auto;left:50%;margin-left:-7px}
.login-bub.pop{animation:mpop2 .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes mpop2{0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.88)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

@media(max-width:380px){#mascotWrap{width:74px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script id="LMS_DATA" type="application/json">[]</script>
<script>
/* ================================================================
   CONFIG — ใส่ URL ของ Power Automate Flow ทั้ง 2 ตัว (ดู setup guide)
   ปล่อยว่าง = โหมดทดลอง (ใช้ข้อมูลที่ฝังในไฟล์ + เก็บ log ในเครื่อง)
   ================================================================ */
const API_GET  = 'https://defaultd303db8cd0344010a7eec47bebf5bc.a3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/23029fdcc05b43a68c91026f7baf675f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=N7qPRRu_Uo-9MlAu9ZzsYRvbnIPegP8iQkP5xw24KJI';   // Flow 1: LMS-GetData   (When HTTP request is received → GET)
const API_POST = 'https://defaultd303db8cd0344010a7eec47bebf5bc.a3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/19/workflows/80c9a8fde13640e39a88c798f7cb1e3d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=J-Tbsz9pZal8XvMLJBlqbnEQBvR5rFSgrFUqzY3zuXU';   // Flow 2: LMS-PostAction (When HTTP request is received → POST)
const LIVE = API_GET.indexOf('http')===0;

/* ================= data & state ================= */
const EMBED = JSON.parse(document.getElementById('LMS_DATA').textContent);
let RAW = EMBED;                 // ถูกแทนที่ด้วยข้อมูลจาก SharePoint เมื่อ LIVE
let ASOF = '31 ก.ค. 2569';      // อัปเดตอัตโนมัติจาก Flow เมื่อ LIVE
const K_LOG='lmsep_log', K_SES='lmsep_ses', K_RW='lmsep_rw';
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },

const MABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function normDate(v){ // รองรับ '5-Jun-26' | เลข serial ของ Excel | ISO 8601
  if(v===null||v===undefined) return '';
  const s=String(v).trim();
  if(!s||s==='nan'||s==='No expiry') return '';
  if(/^\d+(\.\d+)?$/.test(s)){ // Excel serial
    const d=new Date(Date.UTC(1899,11,30)+parseFloat(s)*86400000);
    return d.getUTCDate()+'-'+MABBR[d.getUTCMonth()]+'-'+String(d.getUTCFullYear()).slice(2);
  }
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){ // ISO
    const d=new Date(s);
    return d.getUTCDate()+'-'+MABBR[d.getUTCMonth()]+'-'+String(d.getUTCFullYear()).slice(2);
  }
  return s; // '5-Jun-26' อยู่แล้ว
}
function buildUsersFromRows(rows){
  const users={};
  for(const r of rows){
    const em=String(r['Email']||'').trim().toLowerCase();
    if(!em) continue;
    const u = users[em] || (users[em]={
      email:em,
      name:(String(r['First Name']||'').trim()+' '+String(r['Last Name']||'').trim()).trim(),
      first:String(r['First Name']||'').trim(),
      dept:String(r['Department']||'').trim(),
      pos:String(r['Position']||'').trim(),
      courses:[]
    });
    const status=String(r['Learning Status']||'').trim();
    const added=String(r['Added By']||'').trim();
    const done = status==='Completed';
    u.courses.push({
      n:String(r['Content Name']||'').trim(),
      a: added==='Assigned'?'A':'E',
      s: done?'C':'P',
      d: normDate(r['Completed Date']),
      p: done ? (added==='Assigned'?1:2) : 0,
      t: String(r['Content Type']||'')
    });
  }
  const list=Object.values(users);
  for(const u of list){
    u.pts = u.courses.reduce((s,c)=>s+c.p,0);
    u.done = u.courses.filter(c=>c.s==='C').length;
  }
  return list;
}
async function loadLive(){
  const res=await fetch(API_GET,{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j=await res.json();
  RAW = buildUsersFromRows(j.rows||[]);
  logs = (j.logs||[]).map(l=>({
    id:l.id, email:String(l.email||'').toLowerCase(), name:l.name||'',
    item:l.item||'', rid:l.rid!==undefined&&l.rid!==null?String(l.rid):'',
    pts:Number(l.pts)||0, at:l.at, type:l.type||'redeem', by:l.by||''
  }));
  rewards = (j.rewards||[]).map(r=>({ id:String(r.id), name:r.name||'', pts:Number(r.pts)||0, qty:Number(r.qty)||0 }));
  if(j.asof) ASOF=j.asof;
}
/* ---------- action layer: LIVE → POST เข้า Flow / โหมดทดลอง → localStorage ---------- */
/* Optimistic update: อัปเดตหน้าจอทันที แล้วส่งเข้าเซิร์ฟเวอร์เบื้องหลัง */
function applyLocal(p){
  if(p.action==='redeem') logs.push({id:'tmp'+Date.now(),email:p.email,name:p.name,item:p.item,rid:p.rid,pts:p.pts,at:now(),type:'redeem',by:p.name});
  if(p.action==='adjust') logs.push({id:'tmp'+Date.now(),email:p.email,name:p.name,item:p.note,pts:p.delta,at:now(),type:'adjust',by:'admin'});
  if(p.action==='reward_save'){
    if(p.id){ const r=rewards.find(x=>String(x.id)===String(p.id)); if(r){ r.name=p.name; r.pts=p.pts; r.qty=p.qty; } }
    else rewards.push({id:'tmp'+Date.now(), name:p.name, pts:p.pts, qty:p.qty});
  }
  if(p.action==='reward_delete'){ rewards=rewards.filter(x=>String(x.id)!==String(p.id)); }
  if(p.action==='log_delete'){ logs=logs.filter(x=>String(x.id)!==String(p.id)); }
  if(!LIVE){ store.set(K_LOG,logs); store.set(K_RW,rewards); }
}
function uiIdle(){  // ปลอดภัยที่จะ re-render มั้ย (ไม่มี modal / ไม่ได้พิมพ์อยู่)
  if(document.querySelector('.mask')) return false;
  const ae=document.activeElement;
  return !(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'));
}
async function syncQuiet(){
  try{ await loadLive(); if(session && uiIdle()) render(); }catch(e){}
}
function runAction(p, okMsg, after){
  // รายการที่เพิ่งสร้างยังไม่ได้ ID จริงจากเซิร์ฟเวอร์ — กันลบ/แก้ก่อนซิงค์เสร็จ
  const needId = (p.action==='log_delete'||p.action==='reward_delete'||(p.action==='reward_save'&&p.id));
  if(LIVE && needId && !/^\d+$/.test(String(p.id)))
    return toast('รายการนี้กำลังซิงค์กับเซิร์ฟเวอร์ รอ 2-3 วินาทีแล้วลองใหม่ครับ');
  applyLocal(p);                       // อัปเดตหน้าจอทันที
  if(okMsg) toast(okMsg);
  if(after) after();
  if(LIVE){
    fetch(API_POST,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
      .then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); syncQuiet(); })
      .catch(e=>{ console.error(e); toast('⚠️ บันทึกเข้าเซิร์ฟเวอร์ไม่สำเร็จ — กำลังโหลดข้อมูลจริงกลับมา'); syncQuiet(); });
  }
}

const MON3 = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function parseD(d){ // '5-Jun-26' -> [2026, 6]
  if(!d) return null;
  const p=d.split('-'); if(p.length<3) return null;
  const m=MON3[p[1]]; if(!m) return null;
  return [2000+parseInt(p[2],10), m];
}
function inPeriod(ym, mdef){
  if(!ym) return false;
  const v=ym[0]*100+ym[1];
  const to=mdef.to[0]*100+mdef.to[1];
  if(mdef.cum) return v<=to;
  const fr=mdef.from[0]*100+mdef.from[1];
  return v>=fr && v<=to;
}
function monthPts(u, mdef){
  let s=0;
  for(const c of u.courses){ if(c.s==='C' && c.p && inPeriod(parseD(c.d), mdef)) s+=c.p; }
  return s;
}
function monthBoard(mdef){
  const arr=RAW.map(u=>({email:u.email,name:u.name,dept:u.dept,mp:monthPts(u,mdef)}))
    .filter(u=>u.mp>0)
    .sort((a,b)=>b.mp-a.mp || a.name.localeCompare(b.name));
  arr.forEach((u,i)=>u.rank=i+1);
  return arr;
}

function redeemedOf(email){ return logs.filter(l=>l.email===email && l.type==='redeem').reduce((s,l)=>s+l.pts,0); }
function adjOf(email){ return logs.filter(l=>l.type==='adjust' && l.email===email).reduce((s,l)=>s+l.pts,0); }

function balOf(u){ return effPts(u) - redeemedOf(u.email); }  // แต้มคงเหลือสำหรับแลกรางวัล
function stockLeft(r){ return r.qty - logs.filter(l=>l.type==='redeem' && l.rid===r.id).length; }

function ranked(){
  const arr = RAW.map(u=>({...u, eff: effPts(u), bal: balOf(u)}));
  arr.sort((a,b)=> b.eff-a.eff || b.done-a.done || a.name.localeCompare(b.name));
  arr.forEach((u,i)=>u.rank=i+1);

}

const EMBLEM = `<img src="${MASCOT}" alt="น้อง Pennova · PTT LNG LMS E-Passport" style="width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))">`;
let _greeted=false;
function mascotSay(msg, ms=5600){
  const b=document.getElementById('mascotBub'); if(!b) return;
  b.innerHTML=msg; b.style.display='block';
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  clearTimeout(b._h); b._h=setTimeout(()=>b.style.display='none', ms);
}
function attachMascot(msgs, greet){
  if(document.getElementById('mascotWrap')) document.getElementById('mascotWrap').remove();
  document.body.insertAdjacentHTML('beforeend',
    `<div id="mascotWrap"><div id="mascotBub" class="mbub" style="display:none"></div><img id="mascotImg" src="${MASCOT}" alt="น้อง Pennova มาสคอต PTT LNG"></div>`);
  const img=document.getElementById('mascotImg');
  let i=Math.floor(Math.random()*msgs.length);
  img.onclick=()=>{
    img.classList.remove('hop'); void img.offsetWidth; img.classList.add('hop');
    mascotSay(msgs[i%msgs.length]); i++;
  };
  if(greet && !_greeted){ _greeted=true; setTimeout(()=>mascotSay(greet),800); }
}
function removeMascot(){ const m=document.getElementById('mascotWrap'); if(m) m.remove(); }

/* ================= login ================= */
function viewLogin(){
  const app=document.getElementById('app');
  app.innerHTML = `
  <div class="login">
    <div class="mascot-login-wrap">
      <div class="mbub login-bub" id="loginBub" style="display:none"></div>
      <img class="mascot-login" id="loginMascot" src="${MASCOT}" alt="น้อง Pennova">
    </div>
    <div class="passport-cover">
      <div class="cover-eyebrow">PTT LNG · Learning</div>
      <div class="cover-title kanit">LMS E-Passport</div>
      <div class="cover-sub">สมุดสะสมแต้มการเรียนรู้ · ข้อมูล ณ ${ASOF}</div>
      <div class="fld">
        <input id="loginInp" placeholder="พิมพ์ชื่อ หรือ อีเมล @pttlng.com" autocomplete="off" autocapitalize="off">
        <div id="sugs" class="sugs" style="display:none"></div>
      </div>
      <button class="btn" id="loginBtn">เปิดสมุดแต้มของฉัน</button>
      <div class="err" id="loginErr"></div>
      <div class="hint">ไม่ต้องใช้รหัสผ่าน · เห็นเฉพาะข้อมูลของตนเอง</div>
    </div>
  </div>`;
  const inp=document.getElementById('loginInp'), sugs=document.getElementById('sugs'), err=document.getElementById('loginErr');
  let picked=null;
  function renderSugs(){
    const q=inp.value.trim().toLowerCase();
    picked=null;
    if(q.length<2 || q==='admin1234'){ sugs.style.display='none'; return; }
    const hits = RAW.filter(u=> u.email.includes(q) || u.name.toLowerCase().includes(q)).slice(0,8);
    if(!hits.length){ sugs.style.display='none'; return; }
    sugs.innerHTML = hits.map(u=>`<div class="sug" data-e="${u.email}"><span>${u.name}</span><small>${u.email} · ${u.dept}</small></div>`).join('');
    sugs.style.display='block';
    sugs.querySelectorAll('.sug').forEach(el=>el.onclick=()=>{ inp.value=el.dataset.e; picked=el.dataset.e; sugs.style.display='none'; });
  }
  inp.addEventListener('input', renderSugs);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  document.addEventListener('click', e=>{ if(!sugs.contains(e.target)&&e.target!==inp) sugs.style.display='none'; });
  function go(){
    const v=inp.value.trim().toLowerCase();
    err.textContent='';
    if(v==='admin1234'){ session={admin:true}; store.set(K_SES,session); return render(); }
    let u = findUser(picked||v) || RAW.find(x=>x.email===v) || RAW.find(x=>x.email.split('@')[0]===v);
    if(!u){ const hits=RAW.filter(x=>x.email.includes(v)||x.name.toLowerCase().includes(v)); if(hits.length===1) u=hits[0]; }
    if(!u){ err.textContent='ไม่พบผู้ใช้นี้ในรายงาน LMS — ลองพิมพ์ชื่อแล้วเลือกจากรายการ'; return; }
    session={email:u.email}; store.set(K_SES,session); render();
  }
  document.getElementById('loginBtn').onclick=go;
  setTimeout(()=>inp.focus(),100);
  removeMascot();
  {
    const lm=document.getElementById('loginMascot'), lb=document.getElementById('loginBub');
    const lessons=[
      `สวัสดีครับ ผมน้อง Pennova! 🐧<br>พิมพ์<b>ชื่อตัวเอง</b>ในช่องด้านล่าง แล้วกด "เปิดสมุดแต้มของฉัน" เพื่อดูคะแนนจากการเรียน LMS ได้เลย <b>ไม่ต้องใช้รหัสผ่าน</b>ครับ`,
      `พิมพ์ชื่อไป 2-3 ตัวอักษร เดี๋ยวมีรายชื่อขึ้นมาให้เลือกครับ 😊`,
      `เข้าไปแล้วจะเห็นแต้มสะสม อันดับ และแลกของรางวัลได้ด้วยนะ 🎁`,
    ];
    let li=0;
    function teach(){
      lb.innerHTML=lessons[li%lessons.length]; li++;
      lb.style.display='block';
      lb.classList.remove('pop'); void lb.offsetWidth; lb.classList.add('pop');
      clearTimeout(lb._h); lb._h=setTimeout(()=>lb.style.display='none', 9000);
    }
    lm.onclick=()=>{ lm.classList.remove('hop'); void lm.offsetWidth; lm.classList.add('hop'); teach(); };
    setTimeout(teach, 700);
    inp.addEventListener('input', ()=>{ if(inp.value.length>0){ lb.style.display='none'; } });
  }
}

/* ================= user dashboard ================= */
function viewUser(email){
  const app=document.getElementById('app');
  const all=ranked();
  const me=all.find(u=>u.email===email);
  if(!me){ session=null; store.set(K_SES,null); return viewLogin(); }
  const red = redeemedOf(email), ad = adjOf(email);
  const above = me.rank>1 ? all[me.rank-2] : null;
  const gap = above ? (above.eff - me.eff + 1) : 0;
  const pct = above && above.eff>0 ? Math.min(100, Math.round(me.eff/above.eff*100)) : 100;
  const top10=all.slice(0,10);
  const inTop = me.rank<=10;
  const myCoursesC = me.courses.filter(c=>c.s==='C');
  const myCoursesP = me.courses.filter(c=>c.s==='P');
  const myLogs = logs.filter(l=>l.email===email).slice().reverse();
  const myRedeemedLog = logs.find(l=>l.email===email && l.type==='redeem');  // กติกา: 1 รางวัล/คน
  const km=kmTop3();

  app.innerHTML = `
  <div class="wrap">
    <div class="topbar">
      <div class="emblem">${EMBLEM}</div>
      <div class="who"><div class="nm">${me.name}</div><div class="dp">${me.dept}</div></div>
      <button class="logout" id="outBtn">ออก</button>
    </div>

    <div class="pp">
      <div class="lbl">แต้มสะสมรวม (ใช้จัดอันดับ)</div>
      <div class="bigpts"><span class="n">${thNum(me.eff)}</span><span class="u">แต้ม</span></div>
      <div class="sub">🎁 ใช้แลกรางวัลได้ <b style="color:var(--gold);font-family:'JetBrains Mono'">${thNum(me.bal)}</b> แต้ม${red?` · แลกไปแล้ว ${thNum(red)}`:''}${ad? (ad>0?` · ปรับเพิ่ม +${thNum(ad)}`:` · ปรับลด −${thNum(-ad)}`):''}</div>
      <div class="stamp"><b>#${me.rank}</b><span>RANK</span></div>
    </div>

    <div class="ppgrid">
      <div class="mini"><div class="k">เรียนจบแล้ว</div><div class="v">${me.done}<small> คอร์ส</small></div></div>
      <div class="mini"><div class="k">กำลังเรียน</div><div class="v">${myCoursesP.length}<small> คอร์ส</small></div></div>
    </div>

    <div class="chase">
      ${above
        ? `<div class="t">อีก <b>${thNum(gap)} แต้ม</b> จะแซง ${above.name} (อันดับ ${above.rank})</div>
           <div class="bar"><i style="width:${pct}%"></i></div>
           <div class="cap"><span>คุณ ${thNum(me.eff)}</span><span>${thNum(above.eff)} แต้ม</span></div>`
        : `<div class="t"><span class="crown">👑</span> คุณคืออันดับ 1 ของ PTT LNG — รักษาตำแหน่งไว้!</div>
           <div class="bar"><i style="width:100%"></i></div>`}
    </div>

    <div class="sec">
      <h3>🎁 แลกรางวัล</h3>
      <div class="body">
        <div class="rw-grid">
          ${rewards.map(r=>{
            const left=stockLeft(r);
            const can = left>0 && me.bal>=r.pts && !myRedeemedLog;
            return `<div class="rw ${left<=0||myRedeemedLog?'soldout':''}">
              <div class="rw-name">🎟️ ${escapeHtml(r.name)}</div>
              <div class="rw-pts">${thNum(r.pts)} <small>คะแนน</small></div>
              <div class="rw-stock ${left<=2&&left>0?'low':''}">${left>0?`จำนวน ${thNum(r.qty)} รางวัล · เหลือ ${thNum(left)}`:'รางวัลหมดแล้ว'}</div>
              <button data-r="${r.id}" ${can?'':'disabled'}>${myRedeemedLog?'ใช้สิทธิ์แล้ว': left<=0?'หมดแล้ว': me.bal>=r.pts?'แลกเลย':'แต้มยังไม่พอ'}</button>
            </div>`;
          }).join('')}
        </div>
        <div class="note">${myRedeemedLog
          ? `✅ คุณใช้สิทธิ์แลกแล้ว: <b style="color:var(--gold)">${escapeHtml(myRedeemedLog.item)}</b> (แลกได้คนละ 1 รางวัลเท่านั้น)`
          : `กติกา: แลกได้<b>คนละ 1 รางวัลเท่านั้น</b> เลือกดี ๆ นะ · ใช้แลกได้ ${thNum(me.bal)} แต้ม · การแลกไม่กระทบอันดับ`}</div>
        ${myLogs.length ? `<div style="margin-top:12px">${myLogs.map(l=>logRow(l)).join('')}</div>` : ''}

    <div class="sec">

              <div class="camp-info"><div class="cn">${m.name}</div><div class="cd">${m.desc}${mine?` · คุณ ${thNum(mine.mp)} แต้ม (อันดับ ${mine.rank})`:' · คุณยังไม่มีแต้มในเดือนนี้'}</div></div>
              <div class="camp-lead">${lead?`<div class="who">${lead.email===email?'🎉 คุณนำอยู่!':'ผู้นำ: '+lead.name}</div><div class="pt">${thNum(lead.mp)} แต้ม</div>`:`<div class="who">ยังไม่เริ่ม</div>`}</div>
            </div>`;
          }).join('')}
          <div class="camp-row ${km.some(x=>x.email===email)?'mine':''}">
            <div class="camp-ico km">🏅</div>
            <div class="camp-info"><div class="cn">KM Day</div><div class="cd">แจกคนที่เรียนมากที่สุด 3 รางวัล (นับแต้มจากการเรียนทั้งหมด)</div></div>
          </div>
          ${km.map(u=>`<div class="lb-row ${u.email===email?'me':''}" style="padding:6px 0 6px 52px">
            <div class="rk ${'r'+u.rank}">${u.rank}</div>
            <div class="lb-nm"><div class="n">${u.name}${u.email===email?'<span class="me-tag">คุณ</span>':''}</div><div class="d">${u.dept}</div></div>

      <h3>📗 คอร์สที่เรียนจบแล้ว <span class="cnt">${myCoursesC.length}</span></h3>
      <div class="body">
        ${myCoursesC.length ? myCoursesC.map(c=>courseRow(c)).join('') : `<div class="empty">ยังไม่มีคอร์สที่เรียนจบ — เริ่มเรียนใน LMS เพื่อสะสมแต้ม</div>`}
      </div>
    </div>

    ${myCoursesP.length?`
    <div class="sec">
      <h3>⏳ กำลังเรียน <span class="cnt">${myCoursesP.length}</span></h3>
      <div class="body">${myCoursesP.map(c=>courseRow(c)).join('')}</div>
    </div>`:''}

    <div class="note" style="text-align:center">ข้อมูลจากรายงาน LMS ณ ${ASOF} · Assign 1 แต้ม / Enroll 2 แต้ม (เฉพาะคอร์สที่เรียนจบ)</div>
  </div>`;

  document.getElementById('outBtn').onclick=()=>{ session=null; store.set(K_SES,null); _greeted=false; viewLogin(); };
  {
    const msgs=[
      above ? `อีก <b>${thNum(gap)} แต้ม</b> จะแซง ${escapeHtml(above.first||above.name)} แล้วนะ สู้ ๆ! 💪` : `สุดยอดเลย! คุณคืออันดับ 1 ของ PTT LNG 👑`,
      `ตอนนี้ใช้แลกรางวัลได้ <b>${thNum(me.bal)} แต้ม</b> 🎁 แลกได้เลย ไม่กระทบอันดับนะ`,

    if(left<=0) return toast('รางวัลนี้หมดแล้ว');
    if(me.bal<r.pts) return toast(`แต้มไม่พอ — ต้องใช้ ${thNum(r.pts)} แต้ม (ใช้แลกได้ ${thNum(me.bal)})`);
    confirmModal('ยืนยันการแลกรางวัล',
      `<p>รางวัล: <span style="color:var(--ink)">${escapeHtml(r.name)}</span></p>
       <p>ใช้แต้ม: <b>${thNum(r.pts)}</b> · เหลือแลกได้อีก <b>${thNum(me.bal-r.pts)}</b></p>
       <p style="font-size:.8rem;color:var(--gold)">⚠️ แลกได้คนละ 1 รางวัลเท่านั้น — ยืนยันแล้วจะเปลี่ยนหรือแลกรางวัลอื่นอีกไม่ได้</p>
       <p style="font-size:.8rem">แต้มสะสมรวมและอันดับของคุณไม่เปลี่ยน · เหลือ ${thNum(left)} รางวัล</p>`,
      ()=>{
        runAction({action:'redeem', email, name:me.name, item:r.name, rid:r.id, pts:r.pts},
          `แลก "${r.name}" สำเร็จ − ${thNum(r.pts)} แต้ม`,
          ()=>viewUser(email));
      });
  });
}

function lbRow(u, meEmail){
  const rc = u.rank===1?'r1':u.rank===2?'r2':u.rank===3?'r3':'';
  const me = u.email===meEmail;
  return `<div class="lb-row ${me?'me':''}">

    <div class="lb-pt">${thNum(u.eff)}</div>

}
function courseRow(c){
  const done=c.s==='C';
  return `<div class="course">
    <div class="cstamp ${c.a==='E'?'e':'a'}">${done?`<b>+${c.p}</b><span>PT</span>`:`<b>…</b><span>WIP</span>`}</div>
    <div class="cinfo">

    </div>
  </div>`;

function logRow(l){
  const isAdj = l.type==='adjust';
  const sign = isAdj ? (l.pts>=0?'+':'−') : '−';
  const cls = (isAdj && l.pts>=0) ? 'plus':'';
  return `<div class="log-row">
    <div class="li"><div class="item">${isAdj?'⚙️ ปรับแต้มโดยแอดมิน':'🎁 '+escapeHtml(l.item)}</div><div class="when">${fmtDT(l.at)}</div></div>
    <div class="pt ${cls}">${sign}${thNum(Math.abs(l.pts))}</div>
  </div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function editUser(email){
  const all=ranked(); const u=all.find(x=>x.email===email); if(!u) return;
  const mask=document.createElement('div'); mask.className='mask';
  mask.innerHTML=`<div class="modal">
    <h3 class="kanit">แก้ไขแต้ม — ${u.name}</h3>
    <p>จากการเรียน ${thNum(u.pts)} · ปรับสะสม ${adjOf(email)>=0?'+':''}${thNum(adjOf(email))} · แลกไปแล้ว ${thNum(redeemedOf(email))}</p>
    <p>แต้มสะสมรวมปัจจุบัน: <b>${thNum(u.eff)}</b> · ใช้แลกได้: <b>${thNum(u.bal)}</b></p>
    <label style="font-size:.8rem;color:var(--mut)">กำหนดแต้มสะสมรวมใหม่ (แต้มแลกได้จะขยับตามอัตโนมัติ)</label>
    <input id="newPts" type="number" inputmode="numeric" value="${u.eff}">
    <label style="font-size:.8rem;color:var(--mut);display:block;margin-top:10px">หมายเหตุ (เหตุผลการแก้ไข)</label>
    <input id="adjNote" placeholder="เช่น แก้ไขแต้มตกหล่น" maxlength="80">
    <div class="acts">
      <button class="btn ghost" id="mCancel">ยกเลิก</button>
      <button class="btn" id="mSave">บันทึก</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  mask.querySelector('#mCancel').onclick=()=>mask.remove();
  mask.onclick=e=>{ if(e.target===mask) mask.remove(); };
  mask.querySelector('#mSave').onclick=()=>{
    const nv=parseInt(mask.querySelector('#newPts').value,10);
    if(isNaN(nv)||nv<0) return toast('กรุณาระบุแต้มเป็นตัวเลข 0 ขึ้นไป');
    const delta = nv - u.eff;
    if(delta===0){ mask.remove(); return; }
    const note = mask.querySelector('#adjNote').value.trim() || 'ปรับแต้มโดยแอดมิน';
    mask.remove();
    runAction({action:'adjust', email, name:u.name, note, delta},
      `ปรับแต้ม ${u.name} ${delta>0?'+':''}${thNum(delta)} → ${thNum(nv)} แต้ม`,
      viewAdmin);
  };
}
function editReward(rid){
  const isNew = rid===null;
  const r = isNew ? {id:'rw'+Date.now(), name:'', pts:10, qty:10} : rewards.find(x=>x.id===rid);
  if(!r) return;
  const used = isNew ? 0 : r.qty-stockLeft(r);
  const mask=document.createElement('div'); mask.className='mask';
  mask.innerHTML=`<div class="modal">
    <h3 class="kanit">${isNew?'เพิ่มรางวัลใหม่':'แก้ไขรางวัล'}</h3>
    <label style="font-size:.8rem;color:var(--mut)">ชื่อรางวัล</label>
    <input id="rwName" value="${escapeHtml(r.name)}" placeholder="เช่น Gift Card 300 บาท" maxlength="60">
    <label style="font-size:.8rem;color:var(--mut);display:block;margin-top:10px">แต้มที่ใช้แลก (คะแนน)</label>
    <input id="rwPts" type="number" min="1" inputmode="numeric" value="${r.pts}">
    <label style="font-size:.8rem;color:var(--mut);display:block;margin-top:10px">จำนวนรางวัลทั้งหมด${used?` (แลกไปแล้ว ${thNum(used)})`:''}</label>
    <input id="rwQty" type="number" min="${used}" inputmode="numeric" value="${r.qty}">
    <div class="acts">
      <button class="btn ghost" id="mCancel">ยกเลิก</button>
      <button class="btn" id="mSave">บันทึก</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  mask.querySelector('#mCancel').onclick=()=>mask.remove();
  mask.onclick=e=>{ if(e.target===mask) mask.remove(); };
  mask.querySelector('#mSave').onclick=()=>{
    const name=mask.querySelector('#rwName').value.trim();
    const pts=parseInt(mask.querySelector('#rwPts').value,10);
    const qty=parseInt(mask.querySelector('#rwQty').value,10);
    if(!name) return toast('กรุณาระบุชื่อรางวัล');
    if(isNaN(pts)||pts<1) return toast('แต้มที่ใช้แลกต้องเป็นตัวเลข 1 ขึ้นไป');
    if(isNaN(qty)||qty<used) return toast(`จำนวนรางวัลต้องไม่น้อยกว่าที่แลกไปแล้ว (${used})`);
    mask.remove();
    runAction({action:'reward_save', id:isNew?null:r.id, name, pts, qty},
      isNew?`เพิ่มรางวัล "${name}" แล้ว`:'บันทึกรางวัลเรียบร้อย',
      viewAdmin);
  };
}
function confirmModal(title, html, onOk){
  const mask=document.createElement('div'); mask.className='mask';
  mask.innerHTML=`<div class="modal"><h3 class="kanit">${title}</h3>${html}
    <div class="acts"><button class="btn ghost" id="mCancel">ยกเลิก</button><button class="btn gold" id="mOk">ยืนยัน</button></div></div>`;
  document.body.appendChild(mask);
  mask.querySelector('#mCancel').onclick=()=>mask.remove();
  mask.onclick=e=>{ if(e.target===mask) mask.remove(); };
  mask.querySelector('#mOk').onclick=()=>{ mask.remove(); onOk(); };
}

  <div class="login"><div style="text-align:center">
    <div class="emblem" style="width:110px;height:110px;animation:pulse 1.4s ease-in-out infinite">${EMBLEM}</div>
    <div class="kanit" style="font-size:1.1rem;margin-top:10px">LMS E-Passport</div>
    <div id="loadMsg" style="color:var(--mut);font-size:.9rem;margin-top:8px;min-height:2.8em;max-width:280px;margin-left:auto;margin-right:auto;transition:opacity .3s">${msg}</div>
    <div style="margin-top:6px"><span class="ldot"></span><span class="ldot"></span><span class="ldot"></span></div>
  </div></div>
  <style>
  @keyframes pulse{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.02)}}
  .ldot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin:0 4px;animation:ldot 1.2s ease-in-out infinite}
  .ldot:nth-child(2){animation-delay:.15s}.ldot:nth-child(3){animation-delay:.3s}
  @keyframes ldot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-7px);opacity:1}}
  </style>`;
  const cutes=[
    'น้อง Pennova กำลังเดินเตาะแตะไปหยิบสมุดแต้มให้อยู่ครับ 🐧 รอแป๊บนึงนะ~',
    'กำลังนับแต้มของทุกคนอยู่ค้าบ อีกนิดเดียว... ✨',
    'เช็คอันดับล่าสุดให้อยู่นะ ใครจะขึ้น Top 10 บ้างน้า 🏆',
    'เปิดตู้ของรางวัลเช็คสต๊อก Gift Card ให้อยู่ครับ 🎁',
    'ข้อมูลเยอะนิดนึง น้องขอฮึบ! อีกแป๊บเดียวครับ 💪',
  ];
  let ci=0;
  const el=document.getElementById('loadMsg');
  const iv=setInterval(()=>{
    const cur=document.getElementById('loadMsg');
    if(!cur){ clearInterval(iv); return; }  // หน้าโหลดถูกแทนที่แล้ว
    cur.style.opacity='0';
    setTimeout(()=>{ const c2=document.getElementById('loadMsg'); if(!c2) return;
      c2.innerHTML=cutes[ci%cutes.length]; ci++; c2.style.opacity='1'; }, 300);
  }, 2600);
}
function showLoadError(){
  document.getElementById('app').innerHTML=`
  <div class="login"><div class="passport-cover" style="text-align:center">
    <div class="emblem">${EMBLEM}</div>
    <div class="kanit" style="font-size:1.06rem;margin:8px 0 4px">เชื่อมต่อข้อมูลไม่สำเร็จ</div>
    <div style="color:var(--mut);font-size:.86rem;margin-bottom:16px">ตรวจสอบอินเทอร์เน็ต หรือสถานะ Flow ใน Power Automate<br>แล้วลองใหม่อีกครั้ง</div>
    <button class="btn" onclick="location.reload()">ลองอีกครั้ง</button>
  </div></div>`;
}
(async function init(){
  if(LIVE){
    showLoading('รอโหลดข้อมูลสักครู่นะครับ กำลังดึงแต้มล่าสุดจาก SharePoint 📚');
    try{ await loadLive(); }
    catch(e){ console.error(e); return showLoadError(); }
    setInterval(async()=>{  // sync อัตโนมัติทุก 60 วิ (ข้ามถ้ากำลังพิมพ์/เปิด modal อยู่)
      if(!uiIdle()) return;
      try{ await loadLive(); if(session) render(); }catch(e){}
    }, 60000);
  }
  render();
})();
</script>
